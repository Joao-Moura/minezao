services:
  minecraft:
    image: itzg/minecraft-server:java21
    container_name: minecraft
    environment:
      EULA: "TRUE"
      TYPE: "MODRINTH"
      MEMORY: "5G"
      USE_AIKAR_FLAGS: "true"
      TZ: "America/Sao_Paulo"

      # Segurança
      ONLINE_MODE: "TRUE"
      # WHITELIST: "nick1,nick2"
      # ENFORCE_WHITELIST: "TRUE"
      # OPS: "SeuNick"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: ${RCON_PASSWORD}

      # Packs
      MODRINTH_MODPACK: "/dist/minezao.mrpack"
      RESOURCE_PACK: "https://raw.githubusercontent.com/Joao-Moura/minezao/main/dist/textura-jombastica.zip"
      RESOURCE_PACK_SHA1: "c6b0c8e55534da18778234d02463e8870b1aa348"
      RESOURCE_PACK_ENFORCE: "TRUE"

      # Configurações
      DIFFICULTY: "hard"
      MOTD: "\u00a7l  \u00a7r                         \u00a75\u00a7o\u00a7l\u4f3a\u670d\u5668\u5149\u74b0\u00a7r\n\u00a7b               De \u00a72\u00a7lXi Jinping\u00a7b para o mundo"
    volumes:
      - ./data:/data
      - ./dist:/dist:ro
    ports:
      - "25565:25565"         # jogo (TCP)
      - "24454:24454/udp"     # Simple Voice Chat
    mem_limit: 6g
    cpus: 1.75
    stop_grace_period: 60s
    restart: unless-stopped

  backups:
    image: itzg/mc-backup
    container_name: world-backup
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      BACKUP_INTERVAL: "1h"
      INITIAL_DELAY: "5m"
      RCON_HOST: minecraft
      RCON_PASSWORD: ${RCON_PASSWORD}
      PRUNE_BACKUPS_COUNT: "3"
      PAUSE_IF_NO_PLAYERS: "true"
      TAR_COMPRESS_METHOD: "zstd"
      TZ: "America/Sao_Paulo"
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
